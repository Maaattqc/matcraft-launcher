<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MatCraft Panel</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #111118;
  --bg-tertiary: #0e0e14;
  --text-primary: #f0f0f5;
  --text-secondary: #a0a0b8;
  --text-muted: #6b6b80;
  --glass-bg: rgba(255, 255, 255, 0.03);
  --glass-border: rgba(255, 255, 255, 0.08);
  --primary: #3B82F6;
  --success: #22c55e;
  --destructive: #ef4444;
  --warning: #f59e0b;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}

h1, h2, .server-name {
  font-family: 'Space Grotesk', 'Inter', sans-serif;
}

/* ---------- Aurora gradient animation ---------- */

@keyframes aurora-shift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ---------- Login ---------- */

#login-view {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
  background: var(--bg-primary);
}

.login-card {
  background: var(--bg-secondary);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  padding: 40px;
  width: 100%;
  max-width: 400px;
  backdrop-filter: blur(12px);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
}

.login-card h1 {
  font-size: 26px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 8px;
  background: linear-gradient(135deg, var(--text-primary) 0%, var(--primary) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.login-card .subtitle {
  color: var(--text-muted);
  text-align: center;
  font-size: 14px;
  margin-bottom: 32px;
}

.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

.form-group input {
  width: 100%;
  padding: 11px 14px;
  background: var(--bg-primary);
  border: 1px solid var(--glass-border);
  border-radius: 7px;
  color: var(--text-primary);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  outline: none;
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
}

.form-group input:focus {
  border-color: rgba(59, 130, 246, 0.5);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}

.login-error {
  color: var(--destructive);
  font-size: 13px;
  margin-bottom: 12px;
  display: none;
  background: rgba(239, 68, 68, 0.1);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
}

.btn-primary {
  width: 100%;
  padding: 11px 20px;
  background: linear-gradient(135deg, #3B82F6, #60A5FA, #93C5FD, #a5c8f0, #60A5FA, #3B82F6);
  background-size: 300% 300%;
  animation: aurora-shift 12s ease infinite;
  color: white;
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 7px;
  font-family: 'Space Grotesk', 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 2px 12px rgba(59, 130, 246, 0.3);
}

.btn-primary:hover {
  animation-duration: 8s;
  transform: translateY(-2px);
  box-shadow: 0 6px 25px rgba(59, 130, 246, 0.45);
  border-color: rgba(255, 255, 255, 0.4);
}

.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* ---------- Dashboard ---------- */

#dashboard-view { display: none; }

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  border-bottom: 1px solid var(--glass-border);
  background: var(--bg-secondary);
  backdrop-filter: blur(12px);
}

.topbar h1 {
  font-size: 20px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--text-primary) 0%, var(--primary) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.topbar-user {
  color: var(--text-secondary);
  font-size: 13px;
}

.btn-nav {
  padding: 7px 14px;
  background: linear-gradient(135deg, #3B82F6, #60A5FA, #93C5FD, #60A5FA, #3B82F6);
  background-size: 300% 300%;
  animation: aurora-shift 12s ease infinite;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 7px;
  color: white;
  font-family: 'Space Grotesk', 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 2px 8px rgba(59, 130, 246, 0.25);
}

.btn-nav:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(59, 130, 246, 0.4);
}

.btn-outline {
  padding: 7px 14px;
  background: linear-gradient(180deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%);
  border-top: 1px solid rgba(255, 255, 255, 0.35);
  border-left: 1px solid rgba(255, 255, 255, 0.12);
  border-right: 1px solid rgba(255, 255, 255, 0.12);
  border-bottom: 1px solid rgba(0, 0, 0, 0.3);
  border-radius: 7px;
  color: var(--text-primary);
  font-family: 'Space Grotesk', 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 2px 8px rgba(0,0,0,0.2);
}

.btn-outline:hover {
  background: linear-gradient(180deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.05) 100%);
  transform: translateY(-1px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 4px 16px rgba(0,0,0,0.3);
}

.stats-bar {
  display: flex;
  gap: 12px;
  padding: 20px 24px;
  flex-wrap: wrap;
}

.stat-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  background: var(--bg-secondary);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: 500;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
  transition: all 0.3s ease;
}

.stat-chip:hover {
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
  border-color: rgba(255, 255, 255, 0.12);
}

.stat-chip .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.dot-green { background: var(--success); box-shadow: 0 0 6px rgba(34, 197, 94, 0.4); }
.dot-red { background: var(--destructive); box-shadow: 0 0 6px rgba(239, 68, 68, 0.4); }
.dot-blue { background: var(--primary); box-shadow: 0 0 6px rgba(59, 130, 246, 0.4); }

.server-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 16px;
  padding: 0 24px 24px;
}

/* ---------- Server Card ---------- */

.server-card {
  background: var(--bg-secondary);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  padding: 20px;
  transition: all 0.3s ease;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
}

.server-card:hover {
  border-color: rgba(255, 255, 255, 0.12);
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
  transform: translateY(-2px);
}

.server-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.server-name {
  font-size: 17px;
  font-weight: 700;
  text-transform: capitalize;
}

.server-badges {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.badge {
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.badge-type {
  background: rgba(59, 130, 246, 0.12);
  color: #60A5FA;
}

.badge-status {
  display: flex;
  align-items: center;
  gap: 4px;
}

.badge-active {
  background: rgba(34, 197, 94, 0.12);
  color: var(--success);
}

.badge-inactive {
  background: rgba(239, 68, 68, 0.12);
  color: var(--destructive);
}

.badge-players {
  background: rgba(139, 92, 246, 0.12);
  color: #a78bfa;
  display: flex;
  align-items: center;
  gap: 4px;
}

.badge-players svg {
  width: 12px;
  height: 12px;
}

.pulse {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  animation: pulse 2s ease-in-out infinite;
}

.pulse-green { background: var(--success); }
.pulse-red { background: var(--destructive); }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.server-info {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
  padding: 12px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
}

.info-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.info-label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  font-weight: 600;
}

.info-value {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
}

.server-actions {
  display: flex;
  gap: 8px;
}

.btn-action {
  flex: 1;
  padding: 9px 12px;
  border-radius: 7px;
  font-family: 'Space Grotesk', 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.btn-action:disabled {
  opacity: 0.3;
  cursor: not-allowed;
  transform: none !important;
}

.btn-start {
  background: linear-gradient(135deg, rgba(34, 197, 94, 0.15), rgba(34, 197, 94, 0.08));
  color: var(--success);
  border: 1px solid rgba(34, 197, 94, 0.2);
}
.btn-start:hover:not(:disabled) {
  background: linear-gradient(135deg, rgba(34, 197, 94, 0.25), rgba(34, 197, 94, 0.12));
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(34, 197, 94, 0.15);
}

.btn-stop {
  background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(239, 68, 68, 0.08));
  color: var(--destructive);
  border: 1px solid rgba(239, 68, 68, 0.2);
}
.btn-stop:hover:not(:disabled) {
  background: linear-gradient(135deg, rgba(239, 68, 68, 0.25), rgba(239, 68, 68, 0.12));
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(239, 68, 68, 0.15);
}

.btn-restart {
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(245, 158, 11, 0.08));
  color: var(--warning);
  border: 1px solid rgba(245, 158, 11, 0.2);
}
.btn-restart:hover:not(:disabled) {
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.25), rgba(245, 158, 11, 0.12));
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(245, 158, 11, 0.15);
}

.btn-action .spinner {
  display: none;
  width: 12px;
  height: 12px;
  border: 2px solid transparent;
  border-top-color: currentColor;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}

.btn-action.loading .spinner { display: inline-block; }
.btn-action.loading span { display: none; }

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ---------- Scrollbar ---------- */

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

::selection {
  background: rgba(59, 130, 246, 0.3);
  color: var(--text-primary);
}

/* ---------- Responsive ---------- */

/* ---------- Console Button ---------- */

.btn-console {
  background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(139, 92, 246, 0.08));
  color: #a78bfa;
  border: 1px solid rgba(139, 92, 246, 0.2);
}
.btn-console:hover:not(:disabled) {
  background: linear-gradient(135deg, rgba(139, 92, 246, 0.25), rgba(139, 92, 246, 0.12));
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(139, 92, 246, 0.15);
}

/* ---------- Player List ---------- */

.player-section {
  margin-top: 12px;
  padding: 12px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
}

.player-section-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.player-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.player-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  background: rgba(255, 255, 255, 0.02);
  border-radius: 6px;
  transition: background 0.2s;
}

.player-item:hover {
  background: rgba(255, 255, 255, 0.05);
}

.player-avatar {
  width: 20px;
  height: 20px;
  border-radius: 3px;
  image-rendering: pixelated;
}

.player-name {
  flex: 1;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
}

.player-actions {
  display: flex;
  gap: 4px;
}

.btn-player {
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 700;
  font-family: 'Space Grotesk', 'Inter', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.btn-kick {
  background: rgba(245, 158, 11, 0.12);
  color: var(--warning);
  border: 1px solid rgba(245, 158, 11, 0.2);
}
.btn-kick:hover { background: rgba(245, 158, 11, 0.25); }

.btn-ban {
  background: rgba(239, 68, 68, 0.12);
  color: var(--destructive);
  border: 1px solid rgba(239, 68, 68, 0.2);
}
.btn-ban:hover { background: rgba(239, 68, 68, 0.25); }

/* ---------- Console Modal ---------- */

.console-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(8px);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.console-modal {
  width: 100%;
  max-width: 960px;
  height: 80vh;
  background: #0c0c0c;
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: var(--radius-lg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
  animation: slideUp 0.25s ease;
}

@keyframes slideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.console-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: rgba(255, 255, 255, 0.03);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.console-title {
  font-family: 'Space Grotesk', monospace;
  font-size: 14px;
  font-weight: 700;
  color: #a78bfa;
  display: flex;
  align-items: center;
  gap: 8px;
}

.console-title .dot-live {
  width: 8px;
  height: 8px;
  background: var(--success);
  border-radius: 50%;
  animation: pulse 2s ease-in-out infinite;
  box-shadow: 0 0 6px rgba(34, 197, 94, 0.4);
}

.console-close {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: var(--text-secondary);
  width: 32px;
  height: 32px;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  transition: all 0.2s;
}
.console-close:hover {
  background: rgba(239, 68, 68, 0.15);
  color: var(--destructive);
  border-color: rgba(239, 68, 68, 0.3);
}

.console-logs {
  flex: 1;
  overflow-y: auto;
  padding: 12px 16px;
  font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  font-size: 12px;
  line-height: 1.6;
  color: #d4d4d8;
  white-space: pre-wrap;
  word-break: break-all;
}

.console-logs .log-line { }
.console-logs .log-warn { color: #fbbf24; }
.console-logs .log-error { color: #f87171; }
.console-logs .log-info { color: #60a5fa; }
.console-logs .log-rcon { color: #34d399; font-style: italic; }
.console-logs .log-rcon-error { color: #f87171; font-style: italic; }

.console-input-bar {
  display: flex;
  gap: 8px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.03);
  border-top: 1px solid rgba(255, 255, 255, 0.08);
}

.console-input {
  flex: 1;
  padding: 9px 12px;
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 6px;
  color: #e4e4e7;
  font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s;
}
.console-input:focus {
  border-color: rgba(139, 92, 246, 0.5);
}
.console-input::placeholder { color: #52525b; }

.btn-send {
  padding: 9px 16px;
  background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(139, 92, 246, 0.1));
  border: 1px solid rgba(139, 92, 246, 0.3);
  border-radius: 6px;
  color: #a78bfa;
  font-family: 'Space Grotesk', monospace;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-send:hover {
  background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(139, 92, 246, 0.15));
}

/* ---------- Admin Modal ---------- */

.admin-modal {
  max-width: 820px;
  height: auto;
  max-height: 85vh;
}

.admin-content {
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.admin-user-card {
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  padding: 16px;
}

.admin-user-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.admin-user-name {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--text-primary);
}

.admin-section-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.admin-perm-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

.admin-perm-table th {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  padding: 6px 4px;
  text-align: center;
  border-bottom: 1px solid var(--glass-border);
}

.admin-perm-table th:first-child {
  text-align: left;
  padding-left: 8px;
}

.admin-perm-table td {
  padding: 5px 4px;
  text-align: center;
  border-bottom: 1px solid rgba(255,255,255,0.03);
}

.admin-perm-table td:first-child {
  text-align: left;
  padding-left: 8px;
  font-weight: 500;
  color: var(--text-secondary);
  text-transform: capitalize;
}

.admin-perm-table tr:hover td {
  background: rgba(255,255,255,0.02);
}

.admin-perm-table tr.row-wildcard td {
  border-bottom: 1px solid var(--glass-border);
  padding-top: 8px;
  padding-bottom: 8px;
}

.admin-perm-table tr.row-wildcard td:first-child {
  color: var(--primary);
  font-weight: 700;
}

.admin-perm-table input[type="checkbox"] {
  accent-color: var(--primary);
  cursor: pointer;
  width: 14px;
  height: 14px;
}

.btn-save-perms {
  padding: 7px 16px;
  background: linear-gradient(135deg, rgba(34,197,94,0.15), rgba(34,197,94,0.08));
  color: var(--success);
  border: 1px solid rgba(34,197,94,0.2);
  border-radius: 6px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-save-perms:hover {
  background: linear-gradient(135deg, rgba(34,197,94,0.25), rgba(34,197,94,0.12));
}

.btn-delete-user {
  padding: 7px 12px;
  background: rgba(239,68,68,0.1);
  color: var(--destructive);
  border: 1px solid rgba(239,68,68,0.2);
  border-radius: 6px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-delete-user:hover {
  background: rgba(239,68,68,0.2);
}

.admin-user-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

.admin-saved-msg {
  font-size: 12px;
  color: var(--success);
  opacity: 0;
  transition: opacity 0.3s;
}

.admin-saved-msg.visible {
  opacity: 1;
}

.admin-empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
  font-size: 14px;
}

.admin-add-bar {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  background: rgba(255,255,255,0.02);
  border-bottom: 1px solid var(--glass-border);
}

.admin-add-input {
  flex: 1;
  padding: 9px 12px;
  background: var(--bg-primary);
  border: 1px solid var(--glass-border);
  border-radius: 6px;
  color: var(--text-primary);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s;
}

.admin-add-input:focus {
  border-color: rgba(59,130,246,0.5);
}

.admin-add-input::placeholder {
  color: var(--text-muted);
}

.btn-add-user {
  padding: 9px 16px;
  background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(59,130,246,0.1));
  border: 1px solid rgba(59,130,246,0.3);
  border-radius: 6px;
  color: var(--primary);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}

.btn-add-user:hover {
  background: linear-gradient(135deg, rgba(59,130,246,0.3), rgba(59,130,246,0.15));
}

.btn-add-user:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

@media (max-width: 640px) {
  .server-grid { grid-template-columns: 1fr; padding: 0 12px 12px; }
  .topbar { padding: 12px 16px; }
  .stats-bar { padding: 12px 16px; }
  .topbar-right { gap: 8px; }
  .console-modal { height: 90vh; max-width: 100%; }
  .admin-modal { max-width: 100%; max-height: 90vh; }
  .player-actions { flex-direction: column; }
}
</style>
</head>
<body>

<!-- Login View -->
<div id="login-view">
  <div class="login-card">
    <h1>MatCraft Panel</h1>
    <p class="subtitle">Gestion des serveurs</p>
    <form id="login-form">
      <div class="form-group">
        <label for="username">Nom d'utilisateur</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <div class="login-error" id="login-error"></div>
      <button type="submit" class="btn-primary" id="login-btn">Connexion</button>
    </form>
  </div>
</div>

<!-- Dashboard View -->
<div id="dashboard-view">
  <div class="topbar">
    <h1>MatCraft Panel</h1>
    <div class="topbar-right">
      <button class="btn-nav" id="admin-btn" style="display:none" onclick="panel.openAdmin()">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Permissions
      </button>
      <a class="btn-nav" href="https://sftp.matcraft-mc.com" target="_blank">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        SFTP
      </a>
      <span class="topbar-user" id="user-display"></span>
      <button class="btn-outline" id="logout-btn">Déconnexion</button>
    </div>
  </div>
  <div class="stats-bar" id="stats-bar"></div>
  <div class="server-grid" id="server-grid"></div>
</div>

<!-- Console Modal -->
<div id="console-overlay" class="console-overlay" style="display:none">
  <div class="console-modal">
    <div class="console-header">
      <div class="console-title">
        <div class="dot-live"></div>
        Console — <span id="console-server-name"></span>
      </div>
      <button class="console-close" id="console-close-btn">&times;</button>
    </div>
    <div class="console-logs" id="console-logs"></div>
    <div class="console-input-bar">
      <input type="text" class="console-input" id="console-input" placeholder="Entrer une commande..." autocomplete="off">
      <button class="btn-send" id="console-send-btn">Envoyer</button>
    </div>
  </div>
</div>

<!-- Admin Permissions Modal -->
<div id="admin-overlay" class="console-overlay" style="display:none">
  <div class="console-modal admin-modal">
    <div class="console-header">
      <div class="console-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Gestion des permissions
      </div>
      <button class="console-close" id="admin-close-btn">&times;</button>
    </div>
    <div class="admin-add-bar">
      <input type="text" class="admin-add-input" id="admin-add-input" placeholder="Nom d'utilisateur FileBrowser..." autocomplete="off">
      <button class="btn-add-user" id="admin-add-btn">Ajouter</button>
    </div>
    <div class="admin-content" id="admin-content">
      <div style="padding:20px;color:var(--text-muted)">Chargement...</div>
    </div>
  </div>
</div>

<script>
(() => {
  const loginView = document.getElementById('login-view');
  const dashboardView = document.getElementById('dashboard-view');
  const loginForm = document.getElementById('login-form');
  const loginError = document.getElementById('login-error');
  const loginBtn = document.getElementById('login-btn');
  const logoutBtn = document.getElementById('logout-btn');
  const userDisplay = document.getElementById('user-display');
  const statsBar = document.getElementById('stats-bar');
  const serverGrid = document.getElementById('server-grid');

  let ws = null;
  let servers = [];
  let pendingActions = new Set();
  let currentUser = { username: '', isAdmin: false, permissions: {} };

  // Console state
  const consoleOverlay = document.getElementById('console-overlay');
  const consoleLogs = document.getElementById('console-logs');
  const consoleInput = document.getElementById('console-input');
  const consoleSendBtn = document.getElementById('console-send-btn');
  const consoleCloseBtn = document.getElementById('console-close-btn');
  const consoleServerName = document.getElementById('console-server-name');
  let consoleServer = null;
  let consoleAutoScroll = true;
  let commandHistory = [];
  let historyIndex = -1;
  const MAX_CONSOLE_LINES = 1000;

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // ------ Console ------

  function openConsole(serverName) {
    consoleServer = serverName;
    consoleServerName.textContent = serverName;
    consoleLogs.innerHTML = '';
    consoleAutoScroll = true;
    historyIndex = -1;
    consoleOverlay.style.display = 'flex';
    consoleInput.focus();
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'console:subscribe', server: serverName }));
    }
  }

  function closeConsole() {
    if (consoleServer && ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'console:unsubscribe' }));
    }
    consoleServer = null;
    consoleOverlay.style.display = 'none';
  }

  function classifyLogLine(line) {
    if (/\bWARN\b/i.test(line)) return 'log-warn';
    if (/\bERROR\b/i.test(line) || /\bFATAL\b/i.test(line) || /Exception/i.test(line)) return 'log-error';
    if (/\bINFO\b/i.test(line)) return 'log-info';
    return 'log-line';
  }

  function appendLogLine(text, cls) {
    const div = document.createElement('div');
    div.className = cls || classifyLogLine(text);
    div.textContent = text;
    consoleLogs.appendChild(div);
    // Limit lines
    while (consoleLogs.children.length > MAX_CONSOLE_LINES) {
      consoleLogs.removeChild(consoleLogs.firstChild);
    }
    if (consoleAutoScroll) {
      consoleLogs.scrollTop = consoleLogs.scrollHeight;
    }
  }

  function sendConsoleCommand() {
    const cmd = consoleInput.value.trim();
    if (!cmd || !consoleServer) return;
    commandHistory.push(cmd);
    if (commandHistory.length > 50) commandHistory.shift();
    historyIndex = commandHistory.length;
    consoleInput.value = '';
    appendLogLine('> ' + cmd, 'log-rcon');
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'console:command', server: consoleServer, command: cmd }));
    }
  }

  consoleSendBtn.addEventListener('click', sendConsoleCommand);
  consoleInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { sendConsoleCommand(); return; }
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (historyIndex > 0) {
        historyIndex--;
        consoleInput.value = commandHistory[historyIndex];
      }
    }
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (historyIndex < commandHistory.length - 1) {
        historyIndex++;
        consoleInput.value = commandHistory[historyIndex];
      } else {
        historyIndex = commandHistory.length;
        consoleInput.value = '';
      }
    }
  });

  consoleLogs.addEventListener('scroll', () => {
    const el = consoleLogs;
    consoleAutoScroll = (el.scrollHeight - el.scrollTop - el.clientHeight) < 40;
  });

  consoleCloseBtn.addEventListener('click', closeConsole);
  consoleOverlay.addEventListener('click', (e) => {
    if (e.target === consoleOverlay) closeConsole();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && consoleServer) closeConsole();
  });

  // ------ Player actions ------

  async function kickPlayer(serverName, playerName) {
    if (!confirm(`Kick ${playerName} du serveur ${serverName} ?`)) return;
    try {
      await fetch(`/api/servers/${serverName}/kick`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ player: playerName }),
      });
    } catch {}
  }

  async function banPlayer(serverName, playerName) {
    const reason = prompt(`Bannir ${playerName} du serveur ${serverName}.\nRaison (optionnel) :`);
    if (reason === null) return; // cancelled
    try {
      await fetch(`/api/servers/${serverName}/ban`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ player: playerName, reason: reason || undefined }),
      });
    } catch {}
  }

  // ------ Auth ------

  async function checkAuth() {
    try {
      const res = await fetch('/api/me');
      if (res.ok) {
        const data = await res.json();
        currentUser = {
          username: data.username,
          isAdmin: data.isAdmin,
          permissions: data.permissions || {},
        };
        showDashboard(data.username);
        return;
      }
    } catch {}
    showLogin();
  }

  function showLogin() {
    loginView.style.display = 'flex';
    dashboardView.style.display = 'none';
    disconnectWS();
  }

  function hasAction(action, serverName) {
    if (currentUser.isAdmin) return true;
    const perms = currentUser.permissions;
    // Specific server overrides wildcard
    const serverActions = perms[serverName] ?? perms['*'];
    if (!serverActions) return false;
    return serverActions.includes(action);
  }

  function showDashboard(username) {
    loginView.style.display = 'none';
    dashboardView.style.display = 'block';
    userDisplay.textContent = username;
    // Show/hide admin button
    const adminBtn = document.getElementById('admin-btn');
    if (adminBtn) adminBtn.style.display = currentUser.isAdmin ? 'flex' : 'none';
    fetchServers();
    connectWS();
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginError.style.display = 'none';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Connexion...';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json();
      if (res.ok) {
        // Fetch full permissions after login
        try {
          const meRes = await fetch('/api/me');
          if (meRes.ok) {
            const me = await meRes.json();
            currentUser = { username: me.username, isAdmin: me.isAdmin, permissions: me.permissions || {} };
          }
        } catch {}
        showDashboard(data.username);
      } else {
        loginError.textContent = data.error === 'Invalid credentials' ? 'Identifiants invalides' : (data.error || 'Echec de connexion');
        loginError.style.display = 'block';
      }
    } catch {
      loginError.textContent = 'Erreur de connexion';
      loginError.style.display = 'block';
    }

    loginBtn.disabled = false;
    loginBtn.textContent = 'Connexion';
  });

  logoutBtn.addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST' });
    showLogin();
  });

  // ------ Servers ------

  async function fetchServers() {
    try {
      const res = await fetch('/api/servers');
      if (res.status === 401) { showLogin(); return; }
      if (!res.ok) return;
      servers = await res.json();
      renderServers();
    } catch {}
  }

  async function serverAction(name, action) {
    const key = `${name}:${action}`;
    if (pendingActions.has(key)) return;
    pendingActions.add(key);
    renderServers();

    try {
      const res = await fetch(`/api/servers/${name}/${action}`, { method: 'POST' });
      if (res.status === 401) { showLogin(); return; }
      if (res.ok) {
        const updated = await res.json();
        const idx = servers.findIndex(s => s.name === name);
        if (idx !== -1) servers[idx] = updated;
      }
    } catch {}

    pendingActions.delete(key);
    renderServers();
  }

  // ------ Render ------

  function formatBytes(bytes) {
    if (bytes == null) return '-';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
    if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(0) + ' MB';
    return (bytes / (1024 * 1024 * 1024)).toFixed(1) + ' GB';
  }

  function formatMaxMemory(maxMem) {
    if (!maxMem) return '?';
    const match = maxMem.match(/^(\d+)\s*([GMgm])/);
    if (!match) return maxMem;
    const val = match[1];
    const unit = match[2].toUpperCase();
    return val + (unit === 'G' ? ' GB' : ' MB');
  }

  function formatUptime(iso) {
    if (!iso) return '-';
    const diff = Date.now() - new Date(iso).getTime();
    if (diff < 0) return '-';
    const s = Math.floor(diff / 1000);
    const m = Math.floor(s / 60);
    const h = Math.floor(m / 60);
    const d = Math.floor(h / 24);
    if (d > 0) return `${d}j ${h % 24}h`;
    if (h > 0) return `${h}h ${m % 60}m`;
    if (m > 0) return `${m}m`;
    return `${s}s`;
  }

  function renderStats() {
    const active = servers.filter(s => s.status === 'active').length;
    const inactive = servers.length - active;
    const totalPlayers = servers.reduce((sum, s) => sum + (s.players?.online || 0), 0);
    statsBar.innerHTML = `
      <div class="stat-chip"><div class="dot dot-blue"></div>${servers.length} serveurs</div>
      <div class="stat-chip"><div class="dot dot-green"></div>${active} en ligne</div>
      <div class="stat-chip"><div class="dot dot-red"></div>${inactive} hors ligne</div>
      <div class="stat-chip"><div class="dot dot-green"></div>${totalPlayers} joueur${totalPlayers !== 1 ? 's' : ''}</div>
    `;
  }

  function renderServers() {
    renderStats();
    serverGrid.innerHTML = servers.map(s => {
      const isActive = s.status === 'active';
      const statusBadge = isActive
        ? `<div class="badge badge-status badge-active"><span class="pulse pulse-green"></span>En ligne</div>`
        : `<div class="badge badge-status badge-inactive"><span class="pulse pulse-red"></span>Hors ligne</div>`;
      const playersBadge = isActive && s.players
        ? `<div class="badge badge-players"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>${s.players.online}/${s.players.max}</div>`
        : '';

      const isStarting = pendingActions.has(`${s.name}:start`);
      const isStopping = pendingActions.has(`${s.name}:stop`);
      const isRestarting = pendingActions.has(`${s.name}:restart`);
      const busy = isStarting || isStopping || isRestarting;

      const safeName = escapeHtml(s.name);
      const safeType = escapeHtml(s.type);
      const safePort = escapeHtml(String(s.port));

      return `
        <div class="server-card">
          <div class="server-header">
            <span class="server-name">${safeName}</span>
            <div class="server-badges">
              <div class="badge badge-type">${safeType}</div>
              ${playersBadge}
              ${statusBadge}
            </div>
          </div>
          <div class="server-info">
            <div class="info-item">
              <span class="info-label">Port</span>
              <span class="info-value">${safePort}</span>
            </div>
            <div class="info-item">
              <span class="info-label">Joueurs</span>
              <span class="info-value">${isActive && s.players ? s.players.online + '/' + s.players.max : '-'}</span>
            </div>
            <div class="info-item">
              <span class="info-label">Mémoire</span>
              <span class="info-value">${isActive ? formatBytes(s.memory) + ' / ' + formatMaxMemory(s.maxMemory) : '-'}</span>
            </div>
            <div class="info-item">
              <span class="info-label">Uptime</span>
              <span class="info-value">${isActive ? formatUptime(s.uptime) : '-'}</span>
            </div>
          </div>
          <div class="server-actions">
            <button class="btn-action btn-start ${isStarting ? 'loading' : ''}"
                    onclick="panel.action('${safeName}','start')"
                    ${isActive || busy || !hasAction('start', s.name) ? 'disabled' : ''}>
              <div class="spinner"></div><span>Démarrer</span>
            </button>
            <button class="btn-action btn-stop ${isStopping ? 'loading' : ''}"
                    onclick="panel.action('${safeName}','stop')"
                    ${!isActive || busy || !hasAction('stop', s.name) ? 'disabled' : ''}>
              <div class="spinner"></div><span>Arrêter</span>
            </button>
            <button class="btn-action btn-restart ${isRestarting ? 'loading' : ''}"
                    onclick="panel.action('${safeName}','restart')"
                    ${!isActive || busy || !hasAction('restart', s.name) ? 'disabled' : ''}>
              <div class="spinner"></div><span>Redémarrer</span>
            </button>
            <button class="btn-action btn-console"
                    onclick="panel.openConsole('${safeName}')"
                    ${!isActive || !hasAction('console', s.name) ? 'disabled' : ''}>
              <span>Console</span>
            </button>
          </div>
          ${isActive && s.playerList && s.playerList.length > 0 ? `
          <div class="player-section">
            <div class="player-section-title">Joueurs connectés (${s.playerList.length})</div>
            <div class="player-list">
              ${s.playerList.map(p => {
                const safePName = escapeHtml(p);
                return `<div class="player-item">
                  <img class="player-avatar" src="https://mc-heads.net/avatar/${encodeURIComponent(p)}/20" alt="${safePName}" loading="lazy">
                  <span class="player-name">${safePName}</span>
                  <div class="player-actions">
                    ${hasAction('kick', s.name) ? `<button class="btn-player btn-kick" onclick="panel.kick('${safeName}','${safePName}')">Kick</button>` : ''}
                    ${hasAction('ban', s.name) ? `<button class="btn-player btn-ban" onclick="panel.ban('${safeName}','${safePName}')">Ban</button>` : ''}
                  </div>
                </div>`;
              }).join('')}
            </div>
          </div>` : ''}
        </div>
      `;
    }).join('');
  }

  // ------ WebSocket ------

  function connectWS() {
    disconnectWS();
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws`);

    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'status' && Array.isArray(msg.servers)) {
          servers = msg.servers;
          renderServers();
        } else if (msg.type === 'console:history' && msg.server === consoleServer) {
          consoleLogs.innerHTML = '';
          for (const line of msg.lines) appendLogLine(line);
        } else if (msg.type === 'console:log' && msg.server === consoleServer) {
          appendLogLine(msg.line);
        } else if (msg.type === 'console:response' && msg.server === consoleServer) {
          appendLogLine(msg.response, 'log-rcon');
        } else if (msg.type === 'console:error' && msg.server === consoleServer) {
          appendLogLine('[ERROR] ' + msg.error, 'log-rcon-error');
        }
      } catch {}
    };

    ws.onopen = () => {
      // Re-subscribe to console if it was open
      if (consoleServer) {
        ws.send(JSON.stringify({ type: 'console:subscribe', server: consoleServer }));
      }
    };

    ws.onclose = () => {
      setTimeout(() => {
        if (dashboardView.style.display !== 'none') connectWS();
      }, 3000);
    };
  }

  function disconnectWS() {
    if (ws) { ws.close(); ws = null; }
  }

  // ------ Admin Permissions Modal ------

  const adminOverlay = document.getElementById('admin-overlay');
  const adminContent = document.getElementById('admin-content');
  const adminCloseBtn = document.getElementById('admin-close-btn');
  const adminAddInput = document.getElementById('admin-add-input');
  const adminAddBtn = document.getElementById('admin-add-btn');
  let adminData = null;

  const ACTION_LABELS = {
    start: 'Démarrer',
    stop: 'Arrêter',
    restart: 'Redémarrer',
    console: 'Console',
    kick: 'Kick',
    ban: 'Ban',
  };

  async function openAdmin() {
    adminOverlay.style.display = 'flex';
    adminContent.innerHTML = '<div style="padding:20px;color:var(--text-muted)">Chargement...</div>';
    try {
      const res = await fetch('/api/admin/users');
      if (!res.ok) { adminContent.innerHTML = '<div class="admin-empty">Erreur de chargement</div>'; return; }
      adminData = await res.json();
      renderAdmin();
    } catch {
      adminContent.innerHTML = '<div class="admin-empty">Erreur de connexion</div>';
    }
  }

  function closeAdmin() {
    adminOverlay.style.display = 'none';
  }

  adminCloseBtn.addEventListener('click', closeAdmin);
  adminOverlay.addEventListener('click', (e) => {
    if (e.target === adminOverlay) closeAdmin();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && adminOverlay.style.display === 'flex' && !consoleServer) closeAdmin();
  });

  async function addUser() {
    const name = adminAddInput.value.trim();
    if (!name) return;
    adminAddBtn.disabled = true;
    try {
      const res = await fetch('/api/admin/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: name }),
      });
      if (res.ok) {
        adminAddInput.value = '';
        // Refresh admin data
        if (adminData) {
          adminData.users[name] = { '*': [] };
          renderAdmin();
        }
      } else {
        const err = await res.json();
        alert(err.error === 'User already exists' ? 'Cet utilisateur existe déjà.' : (err.error || 'Erreur'));
      }
    } catch {
      alert('Erreur de connexion');
    }
    adminAddBtn.disabled = false;
  }

  adminAddBtn.addEventListener('click', addUser);
  adminAddInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addUser();
  });

  function renderAdmin() {
    if (!adminData) return;
    const { users, serverNames, allActions } = adminData;
    const userNames = Object.keys(users);

    if (userNames.length === 0) {
      adminContent.innerHTML = '<div class="admin-empty">Aucun utilisateur enregistré.<br>Les utilisateurs apparaîtront ici après leur première connexion.</div>';
      return;
    }

    adminContent.innerHTML = userNames.map(name => {
      const perms = users[name]; // Record<string, string[]>
      const hasWildcard = '*' in perms;
      const wildcardActions = perms['*'] || [];
      const safeName = escapeHtml(name);

      // Build table rows: first row = "Tous" (bulk toggle), then each server
      const allVisible = hasWildcard ? true : serverNames.every(sn => sn in perms);
      const wildcardRow = `<tr class="row-wildcard">
        <td>Tous</td>
        <td><input type="checkbox" class="cb-all-vis" ${allVisible ? 'checked' : ''} onchange="panel.toggleAllVis(this)"></td>
        ${allActions.map(a =>
          `<td><input type="checkbox" data-act-all="${a}" onchange="panel.toggleAllAct(this, '${a}')"></td>`
        ).join('')}
      </tr>`;

      const serverRows = serverNames.map(sn => {
        const safeSn = escapeHtml(sn);
        const hasSpecific = sn in perms;
        const srvActions = perms[sn] || [];
        const isVisible = hasSpecific || hasWildcard;
        return `<tr>
          <td>${safeSn}</td>
          <td><input type="checkbox" class="cb-vis" data-srv="${safeSn}" ${isVisible ? 'checked' : ''} onchange="panel.onVisToggle(this)"></td>
          ${allActions.map(a => {
            const checked = hasSpecific ? srvActions.includes(a) : (hasWildcard ? wildcardActions.includes(a) : false);
            return `<td><input type="checkbox" data-srv="${safeSn}" data-act="${a}" ${checked ? 'checked' : ''} ${!isVisible ? 'disabled' : ''}></td>`;
          }).join('')}
        </tr>`;
      }).join('');

      return `
        <div class="admin-user-card" data-user="${safeName}">
          <div class="admin-user-header">
            <span class="admin-user-name">${safeName}</span>
            <div class="admin-user-actions">
              <span class="admin-saved-msg" id="saved-${safeName}">Sauvegardé !</span>
              <button class="btn-save-perms" onclick="panel.savePerms('${safeName}')">Sauvegarder</button>
              <button class="btn-delete-user" onclick="panel.deleteUser('${safeName}')">Supprimer</button>
            </div>
          </div>
          <table class="admin-perm-table">
            <thead><tr>
              <th>Serveur</th>
              <th>Visible</th>
              ${allActions.map(a => `<th>${ACTION_LABELS[a] || a}</th>`).join('')}
            </tr></thead>
            <tbody>
              ${wildcardRow}
              ${serverRows}
            </tbody>
          </table>
        </div>
      `;
    }).join('');
  }

  function toggleAllVis(el) {
    const card = el.closest('.admin-user-card');
    const isOn = el.checked;
    card.querySelectorAll('.cb-vis').forEach(cb => {
      cb.checked = isOn;
      // Enable/disable action checkboxes for that row
      const row = cb.closest('tr');
      row.querySelectorAll('input[data-act]').forEach(act => {
        if (!isOn) { act.checked = false; act.disabled = true; }
        else act.disabled = false;
      });
    });
  }

  function toggleAllAct(el, action) {
    const card = el.closest('.admin-user-card');
    const isOn = el.checked;
    card.querySelectorAll(`input[data-act="${action}"]`).forEach(cb => {
      if (!cb.disabled) cb.checked = isOn;
    });
  }

  function onVisToggle(el) {
    const row = el.closest('tr');
    const isOn = el.checked;
    row.querySelectorAll('input[data-act]').forEach(cb => {
      if (!isOn) { cb.checked = false; cb.disabled = true; }
      else cb.disabled = false;
    });
    // Update "Tous" visible checkbox state
    const card = el.closest('.admin-user-card');
    const allVis = card.querySelector('.cb-all-vis');
    const allChecked = [...card.querySelectorAll('.cb-vis')].every(cb => cb.checked);
    allVis.checked = allChecked;
  }

  async function savePerms(username) {
    const card = document.querySelector(`.admin-user-card[data-user="${username}"]`);
    if (!card) return;

    const result = {};
    // Collect each visible server with its actions
    card.querySelectorAll('.cb-vis').forEach(visCb => {
      if (!visCb.checked) return;
      const srv = visCb.dataset.srv;
      const row = visCb.closest('tr');
      const acts = [];
      row.querySelectorAll('input[data-act]').forEach(cb => {
        if (cb.checked) acts.push(cb.dataset.act);
      });
      result[srv] = acts;
    });

    try {
      const res = await fetch(`/api/admin/users/${encodeURIComponent(username)}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(result),
      });
      if (res.ok) {
        if (adminData) adminData.users[username] = result;
        const msg = document.getElementById('saved-' + username);
        if (msg) {
          msg.classList.add('visible');
          setTimeout(() => msg.classList.remove('visible'), 2000);
        }
      }
    } catch {}
  }

  async function deleteUser(username) {
    if (!confirm(`Supprimer les permissions de ${username} ? L'utilisateur redeviendra read-only.`)) return;
    try {
      const res = await fetch(`/api/admin/users/${encodeURIComponent(username)}`, { method: 'DELETE' });
      if (res.ok && adminData) {
        delete adminData.users[username];
        renderAdmin();
      }
    } catch {}
  }

  window.panel = {
    action: serverAction,
    openConsole,
    kick: kickPlayer,
    ban: banPlayer,
    openAdmin,
    savePerms,
    deleteUser,
    toggleAllVis,
    toggleAllAct,
    onVisToggle,
  };
  checkAuth();
})();
</script>

</body>
</html>
