<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MatCraft Panel</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #111118;
  --bg-tertiary: #0e0e14;
  --text-primary: #f0f0f5;
  --text-secondary: #a0a0b8;
  --text-muted: #6b6b80;
  --glass-bg: rgba(255, 255, 255, 0.03);
  --glass-border: rgba(255, 255, 255, 0.08);
  --primary: #3B82F6;
  --success: #22c55e;
  --destructive: #ef4444;
  --warning: #f59e0b;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}

h1, h2, .server-name {
  font-family: 'Space Grotesk', 'Inter', sans-serif;
}

/* ---------- Aurora gradient animation ---------- */

@keyframes aurora-shift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ---------- Login ---------- */

#login-view {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
  background: var(--bg-primary);
}

.login-card {
  background: var(--bg-secondary);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  padding: 40px;
  width: 100%;
  max-width: 400px;
  backdrop-filter: blur(12px);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
}

.login-card h1 {
  font-size: 26px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 8px;
  background: linear-gradient(135deg, var(--text-primary) 0%, var(--primary) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.login-card .subtitle {
  color: var(--text-muted);
  text-align: center;
  font-size: 14px;
  margin-bottom: 32px;
}

.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

.form-group input {
  width: 100%;
  padding: 11px 14px;
  background: var(--bg-primary);
  border: 1px solid var(--glass-border);
  border-radius: 7px;
  color: var(--text-primary);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  outline: none;
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
}

.form-group input:focus {
  border-color: rgba(59, 130, 246, 0.5);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}

.login-error {
  color: var(--destructive);
  font-size: 13px;
  margin-bottom: 12px;
  display: none;
  background: rgba(239, 68, 68, 0.1);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
}

.btn-primary {
  width: 100%;
  padding: 11px 20px;
  background: linear-gradient(135deg, #3B82F6, #60A5FA, #93C5FD, #a5c8f0, #60A5FA, #3B82F6);
  background-size: 300% 300%;
  animation: aurora-shift 12s ease infinite;
  color: white;
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 7px;
  font-family: 'Space Grotesk', 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 2px 12px rgba(59, 130, 246, 0.3);
}

.btn-primary:hover {
  animation-duration: 8s;
  transform: translateY(-2px);
  box-shadow: 0 6px 25px rgba(59, 130, 246, 0.45);
  border-color: rgba(255, 255, 255, 0.4);
}

.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* ---------- Dashboard ---------- */

#dashboard-view { display: none; }

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  border-bottom: 1px solid var(--glass-border);
  background: var(--bg-secondary);
  backdrop-filter: blur(12px);
}

.topbar h1 {
  font-size: 20px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--text-primary) 0%, var(--primary) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.topbar-user {
  color: var(--text-secondary);
  font-size: 13px;
}

.btn-nav {
  padding: 7px 14px;
  background: linear-gradient(135deg, #3B82F6, #60A5FA, #93C5FD, #60A5FA, #3B82F6);
  background-size: 300% 300%;
  animation: aurora-shift 12s ease infinite;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 7px;
  color: white;
  font-family: 'Space Grotesk', 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 2px 8px rgba(59, 130, 246, 0.25);
}

.btn-nav:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(59, 130, 246, 0.4);
}

.btn-outline {
  padding: 7px 14px;
  background: linear-gradient(180deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%);
  border-top: 1px solid rgba(255, 255, 255, 0.35);
  border-left: 1px solid rgba(255, 255, 255, 0.12);
  border-right: 1px solid rgba(255, 255, 255, 0.12);
  border-bottom: 1px solid rgba(0, 0, 0, 0.3);
  border-radius: 7px;
  color: var(--text-primary);
  font-family: 'Space Grotesk', 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 2px 8px rgba(0,0,0,0.2);
}

.btn-outline:hover {
  background: linear-gradient(180deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.05) 100%);
  transform: translateY(-1px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 4px 16px rgba(0,0,0,0.3);
}

.stats-bar {
  display: flex;
  gap: 12px;
  padding: 20px 24px;
  flex-wrap: wrap;
}

.stat-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  background: var(--bg-secondary);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: 500;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
  transition: all 0.3s ease;
}

.stat-chip:hover {
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
  border-color: rgba(255, 255, 255, 0.12);
}

.stat-chip .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.dot-green { background: var(--success); box-shadow: 0 0 6px rgba(34, 197, 94, 0.4); }
.dot-red { background: var(--destructive); box-shadow: 0 0 6px rgba(239, 68, 68, 0.4); }
.dot-blue { background: var(--primary); box-shadow: 0 0 6px rgba(59, 130, 246, 0.4); }

.server-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 16px;
  padding: 0 24px 24px;
}

/* ---------- Server Card ---------- */

.server-card {
  background: var(--bg-secondary);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  padding: 20px;
  transition: all 0.3s ease;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
}

.server-card:hover {
  border-color: rgba(255, 255, 255, 0.12);
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
  transform: translateY(-2px);
}

.server-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.server-name {
  font-size: 17px;
  font-weight: 700;
  text-transform: capitalize;
}

.server-badges {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.badge {
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.badge-type {
  background: rgba(59, 130, 246, 0.12);
  color: #60A5FA;
}

.badge-status {
  display: flex;
  align-items: center;
  gap: 4px;
}

.badge-active {
  background: rgba(34, 197, 94, 0.12);
  color: var(--success);
}

.badge-inactive {
  background: rgba(239, 68, 68, 0.12);
  color: var(--destructive);
}

.badge-players {
  background: rgba(139, 92, 246, 0.12);
  color: #a78bfa;
  display: flex;
  align-items: center;
  gap: 4px;
}

.badge-players svg {
  width: 12px;
  height: 12px;
}

.pulse {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  animation: pulse 2s ease-in-out infinite;
}

.pulse-green { background: var(--success); }
.pulse-red { background: var(--destructive); }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.server-info {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
  padding: 12px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
}

.info-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.info-label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  font-weight: 600;
}

.info-value {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
}

.server-actions {
  display: flex;
  gap: 8px;
}

.btn-action {
  flex: 1;
  padding: 9px 12px;
  border-radius: 7px;
  font-family: 'Space Grotesk', 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.btn-action:disabled {
  opacity: 0.3;
  cursor: not-allowed;
  transform: none !important;
}

.btn-start {
  background: linear-gradient(135deg, rgba(34, 197, 94, 0.15), rgba(34, 197, 94, 0.08));
  color: var(--success);
  border: 1px solid rgba(34, 197, 94, 0.2);
}
.btn-start:hover:not(:disabled) {
  background: linear-gradient(135deg, rgba(34, 197, 94, 0.25), rgba(34, 197, 94, 0.12));
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(34, 197, 94, 0.15);
}

.btn-stop {
  background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(239, 68, 68, 0.08));
  color: var(--destructive);
  border: 1px solid rgba(239, 68, 68, 0.2);
}
.btn-stop:hover:not(:disabled) {
  background: linear-gradient(135deg, rgba(239, 68, 68, 0.25), rgba(239, 68, 68, 0.12));
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(239, 68, 68, 0.15);
}

.btn-restart {
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(245, 158, 11, 0.08));
  color: var(--warning);
  border: 1px solid rgba(245, 158, 11, 0.2);
}
.btn-restart:hover:not(:disabled) {
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.25), rgba(245, 158, 11, 0.12));
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(245, 158, 11, 0.15);
}

.btn-action .spinner {
  display: none;
  width: 12px;
  height: 12px;
  border: 2px solid transparent;
  border-top-color: currentColor;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}

.btn-action.loading .spinner { display: inline-block; }
.btn-action.loading span { display: none; }

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ---------- Scrollbar ---------- */

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

::selection {
  background: rgba(59, 130, 246, 0.3);
  color: var(--text-primary);
}

/* ---------- Responsive ---------- */

@media (max-width: 640px) {
  .server-grid { grid-template-columns: 1fr; padding: 0 12px 12px; }
  .topbar { padding: 12px 16px; }
  .stats-bar { padding: 12px 16px; }
  .topbar-right { gap: 8px; }
}
</style>
</head>
<body>

<!-- Login View -->
<div id="login-view">
  <div class="login-card">
    <h1>MatCraft Panel</h1>
    <p class="subtitle">Gestion des serveurs</p>
    <form id="login-form">
      <div class="form-group">
        <label for="username">Nom d'utilisateur</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <div class="login-error" id="login-error"></div>
      <button type="submit" class="btn-primary" id="login-btn">Connexion</button>
    </form>
  </div>
</div>

<!-- Dashboard View -->
<div id="dashboard-view">
  <div class="topbar">
    <h1>MatCraft Panel</h1>
    <div class="topbar-right">
      <a class="btn-nav" href="https://sftp.matcraft-mc.com" target="_blank">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        SFTP
      </a>
      <span class="topbar-user" id="user-display"></span>
      <button class="btn-outline" id="logout-btn">Deconnexion</button>
    </div>
  </div>
  <div class="stats-bar" id="stats-bar"></div>
  <div class="server-grid" id="server-grid"></div>
</div>

<script>
(() => {
  const loginView = document.getElementById('login-view');
  const dashboardView = document.getElementById('dashboard-view');
  const loginForm = document.getElementById('login-form');
  const loginError = document.getElementById('login-error');
  const loginBtn = document.getElementById('login-btn');
  const logoutBtn = document.getElementById('logout-btn');
  const userDisplay = document.getElementById('user-display');
  const statsBar = document.getElementById('stats-bar');
  const serverGrid = document.getElementById('server-grid');

  let ws = null;
  let servers = [];
  let pendingActions = new Set();

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ------ Auth ------

  async function checkAuth() {
    try {
      const res = await fetch('/api/me');
      if (res.ok) {
        const data = await res.json();
        showDashboard(data.username);
        return;
      }
    } catch {}
    showLogin();
  }

  function showLogin() {
    loginView.style.display = 'flex';
    dashboardView.style.display = 'none';
    disconnectWS();
  }

  function showDashboard(username) {
    loginView.style.display = 'none';
    dashboardView.style.display = 'block';
    userDisplay.textContent = username;
    fetchServers();
    connectWS();
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginError.style.display = 'none';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Connexion...';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json();
      if (res.ok) {
        showDashboard(data.username);
      } else {
        loginError.textContent = data.error === 'Invalid credentials' ? 'Identifiants invalides' : (data.error || 'Echec de connexion');
        loginError.style.display = 'block';
      }
    } catch {
      loginError.textContent = 'Erreur de connexion';
      loginError.style.display = 'block';
    }

    loginBtn.disabled = false;
    loginBtn.textContent = 'Connexion';
  });

  logoutBtn.addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST' });
    showLogin();
  });

  // ------ Servers ------

  async function fetchServers() {
    try {
      const res = await fetch('/api/servers');
      if (res.status === 401) { showLogin(); return; }
      servers = await res.json();
      renderServers();
    } catch {}
  }

  async function serverAction(name, action) {
    const key = `${name}:${action}`;
    if (pendingActions.has(key)) return;
    pendingActions.add(key);
    renderServers();

    try {
      const res = await fetch(`/api/servers/${name}/${action}`, { method: 'POST' });
      if (res.status === 401) { showLogin(); return; }
      if (res.ok) {
        const updated = await res.json();
        const idx = servers.findIndex(s => s.name === name);
        if (idx !== -1) servers[idx] = updated;
      }
    } catch {}

    pendingActions.delete(key);
    renderServers();
  }

  // ------ Render ------

  function formatBytes(bytes) {
    if (bytes == null) return '-';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
    if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(0) + ' MB';
    return (bytes / (1024 * 1024 * 1024)).toFixed(1) + ' GB';
  }

  function formatUptime(iso) {
    if (!iso) return '-';
    const diff = Date.now() - new Date(iso).getTime();
    if (diff < 0) return '-';
    const s = Math.floor(diff / 1000);
    const m = Math.floor(s / 60);
    const h = Math.floor(m / 60);
    const d = Math.floor(h / 24);
    if (d > 0) return `${d}j ${h % 24}h`;
    if (h > 0) return `${h}h ${m % 60}m`;
    if (m > 0) return `${m}m`;
    return `${s}s`;
  }

  function renderStats() {
    const active = servers.filter(s => s.status === 'active').length;
    const inactive = servers.length - active;
    const totalPlayers = servers.reduce((sum, s) => sum + (s.players?.online || 0), 0);
    statsBar.innerHTML = `
      <div class="stat-chip"><div class="dot dot-blue"></div>${servers.length} serveurs</div>
      <div class="stat-chip"><div class="dot dot-green"></div>${active} en ligne</div>
      <div class="stat-chip"><div class="dot dot-red"></div>${inactive} hors ligne</div>
      <div class="stat-chip"><div class="dot dot-green"></div>${totalPlayers} joueur${totalPlayers !== 1 ? 's' : ''}</div>
    `;
  }

  function renderServers() {
    renderStats();
    serverGrid.innerHTML = servers.map(s => {
      const isActive = s.status === 'active';
      const statusBadge = isActive
        ? `<div class="badge badge-status badge-active"><span class="pulse pulse-green"></span>En ligne</div>`
        : `<div class="badge badge-status badge-inactive"><span class="pulse pulse-red"></span>Hors ligne</div>`;
      const playersBadge = isActive && s.players
        ? `<div class="badge badge-players"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>${s.players.online}/${s.players.max}</div>`
        : '';

      const isStarting = pendingActions.has(`${s.name}:start`);
      const isStopping = pendingActions.has(`${s.name}:stop`);
      const isRestarting = pendingActions.has(`${s.name}:restart`);
      const busy = isStarting || isStopping || isRestarting;

      const safeName = escapeHtml(s.name);
      const safeType = escapeHtml(s.type);
      const safePort = escapeHtml(String(s.port));

      return `
        <div class="server-card">
          <div class="server-header">
            <span class="server-name">${safeName}</span>
            <div class="server-badges">
              <div class="badge badge-type">${safeType}</div>
              ${playersBadge}
              ${statusBadge}
            </div>
          </div>
          <div class="server-info">
            <div class="info-item">
              <span class="info-label">Port</span>
              <span class="info-value">${safePort}</span>
            </div>
            <div class="info-item">
              <span class="info-label">Joueurs</span>
              <span class="info-value">${isActive && s.players ? s.players.online + '/' + s.players.max : '-'}</span>
            </div>
            <div class="info-item">
              <span class="info-label">Memoire</span>
              <span class="info-value">${isActive ? formatBytes(s.memory) : '-'}</span>
            </div>
            <div class="info-item">
              <span class="info-label">Uptime</span>
              <span class="info-value">${isActive ? formatUptime(s.uptime) : '-'}</span>
            </div>
          </div>
          <div class="server-actions">
            <button class="btn-action btn-start ${isStarting ? 'loading' : ''}"
                    onclick="panel.action('${safeName}','start')"
                    ${isActive || busy ? 'disabled' : ''}>
              <div class="spinner"></div><span>Demarrer</span>
            </button>
            <button class="btn-action btn-stop ${isStopping ? 'loading' : ''}"
                    onclick="panel.action('${safeName}','stop')"
                    ${!isActive || busy ? 'disabled' : ''}>
              <div class="spinner"></div><span>Arreter</span>
            </button>
            <button class="btn-action btn-restart ${isRestarting ? 'loading' : ''}"
                    onclick="panel.action('${safeName}','restart')"
                    ${!isActive || busy ? 'disabled' : ''}>
              <div class="spinner"></div><span>Redemarrer</span>
            </button>
          </div>
        </div>
      `;
    }).join('');
  }

  // ------ WebSocket ------

  function connectWS() {
    disconnectWS();
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws`);

    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'status' && Array.isArray(msg.servers)) {
          servers = msg.servers;
          renderServers();
        }
      } catch {}
    };

    ws.onclose = () => {
      setTimeout(() => {
        if (dashboardView.style.display !== 'none') connectWS();
      }, 3000);
    };
  }

  function disconnectWS() {
    if (ws) { ws.close(); ws = null; }
  }

  window.panel = { action: serverAction };
  checkAuth();
})();
</script>

</body>
</html>
