name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build:renderer

      - name: Build Electron (Windows)
        run: npx electron-builder --win

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-win
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap

  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build:renderer

      - name: Build Electron (macOS)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-mac
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build:renderer

      - name: Build Electron (Linux)
        run: npx electron-builder --linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/*.AppImage
            dist/latest-linux.yml

  build-mods:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate mods manifest
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const modsDir = path.join(__dirname, 'mods');
          if (!fs.existsSync(modsDir)) { console.log('No mods directory'); process.exit(0); }
          const jars = fs.readdirSync(modsDir).filter(f => f.endsWith('.jar') && !f.includes('-sources'));
          const mods = jars.map(name => {
            const hash = crypto.createHash('sha256').update(fs.readFileSync(path.join(modsDir, name))).digest('hex');
            return { name, sha256: hash };
          });
          fs.writeFileSync(path.join(modsDir, 'manifest.json'), JSON.stringify({ mods }, null, 2));
          console.log('Generated manifest for', mods.length, 'mods:', JSON.stringify(mods, null, 2));
          "

      - name: Upload mods artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-mods
          path: |
            mods/*.jar
            mods/manifest.json

  deploy:
    needs: [build-win, build-mac, build-linux, build-mods]
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-win
          path: release

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-mac
          path: release

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: release

      - name: Download mods artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-mods
          path: release/mods

      - name: Deploy to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "release/*"
          target: "/home/debian/website/azuriom/public/launcher/"
          strip_components: 1

      - name: Clean up old versions
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            LAUNCHER_DIR="/home/debian/website/azuriom/public/launcher"
            echo "Keeping version $VERSION, removing old files..."
            find "$LAUNCHER_DIR" -maxdepth 1 \( -name "*.exe" -o -name "*.blockmap" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" \) ! -name "*$VERSION*" -delete
            echo "Remaining files:"
            ls -la "$LAUNCHER_DIR"
