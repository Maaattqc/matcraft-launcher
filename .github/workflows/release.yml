name: Build & Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build:renderer

      - name: Obfuscate main process JS
        run: node scripts/obfuscate-js.js

      - name: Build Electron (Windows)
        run: npx electron-builder --win

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-win
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap

  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build:renderer

      - name: Obfuscate main process JS
        run: node scripts/obfuscate-js.js

      - name: Build Electron (macOS)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-mac
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build:renderer

      - name: Obfuscate main process JS
        run: node scripts/obfuscate-js.js

      - name: Build Electron (Linux)
        run: npx electron-builder --linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/*.AppImage
            dist/latest-linux.yml

  deploy:
    needs: [build-win, build-mac, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-win
          path: release

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-mac
          path: release

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: release

      - name: Deploy to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "release/*"
          target: "/home/debian/website/azuriom/public/launcher/"
          strip_components: 1

      - name: Clean up old versions
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            LAUNCHER_DIR="/home/debian/website/azuriom/public/launcher"
            echo "Keeping version $VERSION, removing old files..."
            find "$LAUNCHER_DIR" -maxdepth 1 \( -name "*.exe" -o -name "*.blockmap" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" \) ! -name "*$VERSION*" -delete
            echo "Remaining files:"
            ls -la "$LAUNCHER_DIR"

      - name: Generate mods manifest on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /home/debian/website/azuriom/public/launcher/mods
            python3 -c "
            import os, hashlib, json
            jars = sorted(f for f in os.listdir('.') if f.endswith('.jar'))
            mods = []
            for jar in jars:
                h = hashlib.sha256(open(jar, 'rb').read()).hexdigest()
                mods.append({'name': jar, 'sha256': h})
            with open('manifest.json', 'w') as f:
                json.dump({'mods': mods}, f, indent=2)
            print(f'Generated manifest for {len(mods)} mods:')
            for m in mods:
                print(f'  {m[\"name\"]}')
            "

      - name: Generate configs manifest on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /home/debian/website/azuriom/public/launcher/config
            python3 -c "
            import os, hashlib, json
            configs = []
            for root, dirs, files in os.walk('.'):
                for f in files:
                    if f == 'manifest.json':
                        continue
                    full = os.path.join(root, f)
                    rel = os.path.relpath(full, '.').replace(os.sep, '/')
                    h = hashlib.sha256(open(full, 'rb').read()).hexdigest()
                    configs.append({'path': rel, 'sha256': h})
            configs.sort(key=lambda x: x['path'])
            with open('manifest.json', 'w') as out:
                json.dump({'configs': configs}, out, indent=2)
            print(f'Generated configs manifest for {len(configs)} files:')
            for c in configs:
                print(f'  {c[\"path\"]}')
            "
